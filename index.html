<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>오케이 카지노</title>
<meta name="description" content="게임머니로 즐기는 친구용 카지노. 블랙잭, 텍사스 홀덤(온라인 지원), 룰렛, 슬롯.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
<header class="top">
  <div class="brand">OKAY<span>CASINO</span></div>
  <div class="wallet">
    <input id="player-name" maxlength="10" aria-label="이름" value="플레이어">
    <div class="balance" title="보유 게임머니"><small>게임머니</small><b id="balance">0</b></div>
    <button id="reset-btn" class="ghost" type="button">리셋</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button type="button" data-tab="blackjack">블랙잭</button>
  <button type="button" data-tab="holdem">홀덤 (혼자)</button>
  <button type="button" data-tab="online">친구랑 홀덤</button>
  <button type="button" data-tab="roulette">룰렛</button>
  <button type="button" data-tab="slots">슬롯</button>
  <button type="button" data-tab="work">노동</button>
  <button type="button" data-tab="ranking">랭킹</button>
</nav>

<main>
  <section id="g-blackjack" class="game" hidden></section>
  <section id="g-holdem" class="game" hidden></section>
  <section id="g-roulette" class="game" hidden></section>
  <section id="g-slots" class="game" hidden></section>
  <section id="g-online" class="game" hidden></section>
  <section id="g-work" class="game" hidden></section>
  <section id="g-ranking" class="game" hidden></section>
</main>

<p class="howto">친구랑 하려면 <b>친구랑 홀덤</b> 탭에서 방을 만들고 코드를 보내줘. 다른 게임은 혼자 하는 거야.</p>
<footer class="foot">전부 가짜 게임머니야. 실제 돈과 아무 관련 없고, 환전도 안 돼.</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=8"></script>
<script src="js/core.js?v=8"></script>
<script src="js/poker-eval.js?v=8"></script>
<script src="js/online-engine.js?v=8"></script>
<script src="js/blackjack.js?v=8"></script>
<script src="js/roulette.js?v=8"></script>
<script src="js/slots.js?v=8"></script>
<script src="js/holdem.js?v=8"></script>
<script src="js/online.js?v=8"></script>
<script src="js/work.js?v=8"></script>
<script src="js/leaderboard.js?v=8"></script>
<script>
// 확대 방지: 더블탭은 CSS touch-action: manipulation 이 담당 (JS로 막으면 빠른 연타가 씹힘)
(function () {
  // iOS 핀치/제스처 확대 차단
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); });
  });
  // 데스크톱 더블클릭 시 텍스트 선택 방지 (입력창 제외, 클릭 이벤트는 그대로 동작)
  document.addEventListener('dblclick', function (e) {
    if (!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) e.preventDefault();
  });
})();
Casino.start();
</script>
</body>
</html>
