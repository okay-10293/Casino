<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오케이 카지노</title>
<meta name="description" content="게임머니로 즐기는 친구용 카지노. 블랙잭, 텍사스 홀덤, 룰렛, 슬롯.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">OKAY<span>CASINO</span></div>
  <div class="wallet">
    <input id="player-name" maxlength="10" aria-label="이름" value="플레이어">
    <div class="balance" title="보유 게임머니"><small>게임머니</small><b id="balance">0</b></div>
    <button id="reset-btn" class="ghost" type="button">리셋</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button type="button" data-tab="blackjack">블랙잭</button>
  <button type="button" data-tab="holdem">텍사스 홀덤</button>
  <button type="button" data-tab="roulette">룰렛</button>
  <button type="button" data-tab="slots">슬롯</button>
</nav>

<main>
  <section id="g-blackjack" class="game" hidden></section>
  <section id="g-holdem" class="game" hidden></section>
  <section id="g-roulette" class="game" hidden></section>
  <section id="g-slots" class="game" hidden></section>
</main>

<footer class="foot">전부 가짜 게임머니야. 실제 돈과 아무 관련 없고, 환전도 안 돼.</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/poker-eval.js"></script>
<script src="js/blackjack.js"></script>
<script src="js/roulette.js"></script>
<script src="js/slots.js"></script>
<script src="js/holdem.js"></script>
<script>Casino.start();</script>
</body>
</html>
